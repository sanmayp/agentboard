[project]
name = "agentboard"
version = "0.1.0"
description = "One live, read-only page for a fleet of coding agents building in parallel"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentboard = "agentboard.board:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentboard"]

[tool.ruff]
line-length = 120
